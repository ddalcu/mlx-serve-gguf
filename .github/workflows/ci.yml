name: CI

# core: reader + reference dequant, no GPU, on Linux.
# gpu: every kernel on a Metal GPU (GitHub's macos-26 runners are Apple
# Silicon, not M4: a second chip generation for free), plus a real 0.8B file.
# The MLX bindings and staged libs come from a sibling mlx-serve checkout,
# built the way its own CI builds them (same cache keys).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MODEL_REPO: unsloth/Qwen3.5-0.8B-GGUF
  MODEL_FILE: Qwen3.5-0.8B-IQ4_NL.gguf

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: mlx-serve-gguf
      - uses: actions/checkout@v4
        with:
          repository: ddalcu/mlx-serve
          path: mlx-serve
      - name: Cache Zig toolchain
        uses: actions/cache@v4
        with:
          path: mlx-serve/.zig-toolchain
          key: zig-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mlx-serve/scripts/fetch-zig.sh') }}
      - name: Install Zig (mlx-serve's pinned nightly)
        run: |
          bash mlx-serve/scripts/fetch-zig.sh
          echo "$GITHUB_WORKSPACE/mlx-serve/.zig-toolchain" >> "$GITHUB_PATH"
      - name: Core tests
        working-directory: mlx-serve-gguf
        run: zig build test-core --summary all

  gpu:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: mlx-serve-gguf
      - uses: actions/checkout@v4
        with:
          repository: ddalcu/mlx-serve
          path: mlx-serve
      - name: mlx submodules
        working-directory: mlx-serve
        run: git submodule update --init lib/mlx-src lib/mlxc-src

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Zig toolchain
        uses: actions/cache@v4
        with:
          path: mlx-serve/.zig-toolchain
          key: zig-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mlx-serve/scripts/fetch-zig.sh') }}
      - name: Install Zig (mlx-serve's pinned nightly)
        run: |
          bash mlx-serve/scripts/fetch-zig.sh
          echo "$GITHUB_WORKSPACE/mlx-serve/.zig-toolchain" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: brew bundle install --file=mlx-serve/Brewfile

      - name: Compute mlx pin cache key
        id: mlxpin
        working-directory: mlx-serve
        run: |
          echo "mlx=$(git -C lib/mlx-src rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "mlxc=$(git -C lib/mlxc-src rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "xcode=$(xcodebuild -version | tr ' \n' '--')" >> "$GITHUB_OUTPUT"
      - name: Cache self-built mlx + mlx-c
        uses: actions/cache@v4
        with:
          path: mlx-serve/lib/mlx
          key: mlx-stage-${{ steps.mlxpin.outputs.mlx }}-${{ steps.mlxpin.outputs.mlxc }}-${{ steps.mlxpin.outputs.xcode }}
      - name: Build mlx + mlx-c
        run: |
          xcrun -sdk macosx metal --version >/dev/null 2>&1 \
            || sudo xcodebuild -downloadComponent MetalToolchain
          bash mlx-serve/scripts/build-mlx.sh

      - name: Cache test model
        id: model
        uses: actions/cache@v4
        with:
          path: models/${{ env.MODEL_FILE }}
          key: model-${{ env.MODEL_REPO }}-${{ env.MODEL_FILE }}
      - name: Download test model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fSL --retry 3 -o "models/$MODEL_FILE" "https://huggingface.co/$MODEL_REPO/resolve/main/$MODEL_FILE"

      - name: Cache Zig build artifacts
        uses: actions/cache@v4
        with:
          path: |
            mlx-serve-gguf/.zig-cache
            ~/.cache/zig
          key: zig-cache-${{ hashFiles('mlx-serve/scripts/fetch-zig.sh', 'mlx-serve-gguf/build.zig') }}-${{ steps.mlxpin.outputs.xcode }}

      - name: GPU tests (kernels + real file)
        working-directory: mlx-serve-gguf
        run: zig build test -Dmlx-serve=../mlx-serve -Dmodel="$GITHUB_WORKSPACE/models/$MODEL_FILE" --summary all

      - name: Kernel bench smoke (compiles every prefill/decode instantiation)
        working-directory: mlx-serve-gguf
        run: |
          zig build bench -Dmlx-serve=../mlx-serve -Dtypes=iq4_nl,q4_k -Dshapes=e2b
          zig build bench -Dmlx-serve=../mlx-serve -Dtypes=iq4_nl -Dm=64 -Dshapes=e2b
